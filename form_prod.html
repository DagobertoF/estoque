<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="form_prod.css">
    <title>Formulario de Cadastro</title>
</head>
<body>
    <div class="container">
        <h1>Preencha para Cadastrar seu Item</h1>
            <div class="cadastro">
                <form id="form_produto">
                    <input type="text" id="nome" placeholder="Nome do produto" required>
                    <input type="number" id="quantidade" placeholder="Quantidade">
                    <input type="number" id="qnt_minima" placeholder="Quantidade mínima">
                    <input  type="number" id="preco" step="0.01" min="0.00" placeholder="Preço Unitário">
                    <input type="text" id="fornecedor" placeholder="Fornecedor">
                    <button>Cadastrar</button>
                </form>
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
