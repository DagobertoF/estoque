<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="saidas.css" />
    <title>Saidas</title>
  </head>
  <body>
    <header class="cabecalho"> <a href="dashboard.html">← Menu</a>
  <h1>Saídas de produtos</h1>
</header>
    <div class="container">
      <form id="form_saida">
        <select name="produto" id="produto" required>
          <option value="">Selecione um produto</option>
        </select>
        <input
          type="number"
          id="quantidade_saida"
          placeholder="Quantidade de saida: "
          main="1"
          step="1"
          required
        />
        <button>Registrar saida</button>
        <button type="reset">Limpar</button>
      </form>
      <section class="historico">
  <h2>Histórico de saídas</h2>

  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Data</th>
      </tr>
    </thead>

    <tbody id="lista_saidas">
      <tr>
        <td colspan="3">Carregando saídas...</td>
      </tr>
    </tbody>
  </table>
</section>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="saida.js"></script>
  </body>
</html>
